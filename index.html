<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGL Work</title>
    <!-- importing glMatrix library -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/2.8.1/gl-matrix-min.js"
      integrity="sha512-zhHQR0/H5SEBL3Wn6yYSaTTZej12z0hVZKOv3TwCUXT1z5qeqGcXJLLrbERYRScEDDpYIJhPC1fk31gqR783iQ=="
      crossorigin="anonymous"
      defer></script>
      <!-- importing our javascript file -->
    <script src="./webgl.js" type="module"></script>
</head>
<body>
    <canvas id="gl-canvas" width="750" height="500" tabindex="0"></canvas> <br>
    
    <!-- Zoom buttons -->
    <button id="zoombutton" onclick="zoomIn()">[+]</button>
    <button id="zoombutton" onclick="zoomOut()">[-]</button>


    <h1>The Fabled Companion Cube</h1>
    <h2>Works best on computer with Mouse</h2>
    <h3>Controls:</h3>
    <ul>
        <li>Click to set canvas focus & Escape to cancel</li>
        <li>Use mouse to look around</li>
        <li>WASD to move camera around</li>
        <li>Space to go up and left CTRL to go down</li>
        <li>Press 'R' to reset view</li>
        <li>Press Play to hear tunes</li>
    </ul>

    <!-- youtube player -->
     <div id="player" ></div>

     <!-- buttons for player -->
      <button onclick="playVideo(), onPlayMusic()">|> Play</button>
      <button onclick="pauseVideo(), onPauseMusic()">|| Pause</button>
      <button onclick="player.seekTo(8, true), onRestartMusic()">* Restart</button>

      <script>
        let tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(tag);

        let player;

        //Player for youtube API
        function onYouTubeIframeAPIReady(){
            player = new YT.Player('player', {
            height: '0',
            width: '0',
            videoId: 'Y6ljFaKRTrI',
            playerVars: {
                'playsinline': 1,
                'start': 8
            }
        });
        }
        //Play
        function playVideo()
        {
            console.log("play")
            player.playVideo();
        }

        //pause
        function pauseVideo()
        {
            console.log("pause")
            player.pauseVideo();
        }

      </script>
</body>
</html>
